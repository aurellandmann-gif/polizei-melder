<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polizei-Melder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:#f4f5f7;color:#14181f}
#map{height:50vh;width:100%}
main{max-width:560px;margin:0 auto;padding:14px}
.card{background:#fff;border:1px solid #e3e6ea;border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:#667085;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #e3e6ea;font:inherit}
button{font:inherit;border:0;border-radius:10px;padding:11px;background:#1d4ed8;color:#fff;width:100%;margin-top:12px;cursor:pointer}
button.s{background:#f4f5f7;color:#14181f;border:1px solid #e3e6ea;width:auto;margin:6px 6px 0 0;padding:6px 10px;font-size:14px}
.mu{color:#667085;font-size:13px}.warn{font-size:12px;color:#667085;border-left:3px solid #d97706;padding-left:10px}
.em{font-size:22px;text-align:center;line-height:30px;background:#fff;border:2px solid #dc2626;border-radius:50%;width:32px;height:32px}
</style></head><body>
<div id="map"></div>
<main>
<div class="card"><b>Neue Meldung</b>
<label>Wo und was? Schreib einfach los</label><input id="loc" maxlength="100" placeholder="z.B. Kuchl Markt Polizei">
<div class="mu" id="pos">Ort wird erkannt und auf der Karte markiert. Oder tippe selbst auf die Karte.</div>
<label>Was macht die Polizei?</label><select id="cat"></select>
<label>Details (optional)</label><textarea id="note" rows="2" maxlength="200"></textarea>
<button id="send">Melden</button><div class="mu" id="msg"></div></div>
<div id="list"></div>
<p class="warn">Hinweis: In Österreich ist die Nutzung von Radarwarnern (auch Apps) während der Fahrt verboten. Nur als Beifahrer oder im Stand nutzen.</p>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const ICON={"Geschwindigkeitskontrolle (Radar/Laser)":"📸","Verkehrskontrolle / Anhaltung":"🛑","Unfallaufnahme":"💥","Straßensperre / Umleitung":"🚧","Streife unterwegs":"🚓","Sonstiges":"ℹ️"};
for(const c in ICON){const o=document.createElement("option");o.textContent=c;$("cat").append(o)}
const map=L.map("map").setView([47.8095,13.055],11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);let pin=null,pos=null,me=null,userSet=false,lastQ="",tm=null;
function setPos(ll){pos=ll;if(pin)pin.setLatLng(ll);else pin=L.marker(ll).addTo(map);$("pos").textContent="Position gewählt ✓ ("+ll.lat.toFixed(4)+", "+ll.lng.toFixed(4)+")"}
map.on("click",e=>{userSet=true;lastQ=$("loc").value.trim();setPos(e.latlng)});
navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{
  const ll=L.latLng(p.coords.latitude,p.coords.longitude);if(!userSet)map.setView(ll,13);
  me=L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#1d4ed8",fillOpacity:1}).addTo(map);if(!userSet)setPos(ll);
},()=>{},{enableHighAccuracy:true,timeout:10000});
const KW=[["Geschwindigkeitskontrolle (Radar/Laser)",["radar","blitzer","laser","messung","speed"]],["Unfallaufnahme",["unfall","crash"]],["Straßensperre / Umleitung",["sperre","sperrung","gesperrt","umleitung"]],["Verkehrskontrolle / Anhaltung",["kontrolle","anhaltung","alkohol","checkpoint"]],["Streife unterwegs",["polizei","streife","polizist","cops"]]];
const STOP=["bei","in","auf","der","die","das","am","an","von","gerade","jetzt","steht","stehen","wieder","ist","sind","mit"];
function parse(t){
  let cat=null;const keep=[];
  for(const w of t.split(/[\s,]+/).filter(Boolean)){
    const l=w.toLowerCase();let hit=false;
    for(const [c,ks] of KW)if(ks.some(k=>l.includes(k))){if(!cat)cat=c;hit=true;break}
    if(!hit&&!STOP.includes(l))keep.push(w);
  }
  return{cat,place:keep.join(" ")};
}
async function resolve(){
  const t=$("loc").value.trim();if(!t||t===lastQ)return;lastQ=t;
  const {cat,place}=parse(t);
  if(cat)$("cat").value=cat;
  if(!place){$("pos").textContent="Kein Ort erkannt. Schreib z.B. Kuchl Markt oder tippe auf die Karte.";return}
  $("pos").textContent="Suche \""+place+"\"…";
  try{
    const r=await fetch("/api/geocode?q="+encodeURIComponent(place));
    const j=await r.json();
    if(j.notFound||j.error||typeof j.lat!=="number"){$("pos").textContent="Ort nicht gefunden. Tippe auf die Karte, um ihn zu setzen.";return}
    userSet=true;setPos(L.latLng(j.lat,j.lng));map.setView([j.lat,j.lng],14);
    $("pos").textContent="Erkannt: "+j.name+(cat?" · "+cat:"")+" ✓";
  }catch{$("pos").textContent="Suche fehlgeschlagen. Tippe auf die Karte."}
}
$("loc").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(resolve,900)});
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"gerade eben":m<60?`vor ${m} Min.`:`vor ${Math.floor(m/60)} Std. ${m%60} Min.`};
async function vote(id,k){try{await fetch(`/api/reports/${id}/${k}`,{method:"POST"});load()}catch{}}
function card(r,popup){
  const d=document.createElement("div");if(!popup)d.className="card";
  const h=document.createElement("b");h.textContent=(ICON[r.cat]||"")+" "+r.cat;
  const l=document.createElement("div");l.textContent=r.loc||"";
  const t=document.createElement("div");t.className="mu";t.textContent=ago(r.t);
  d.append(h,l);if(r.note){const n=document.createElement("div");n.textContent=r.note;d.append(n)}d.append(t);
  for(const [k,txt,n] of [["still","👍 Noch da",r.still],["gone","👋 Weg",r.gone]]){
    const b=document.createElement("button");b.className="s";b.textContent=`${txt} (${n})`;b.onclick=()=>vote(r.id,k);d.append(b)}
  return d;
}
async function load(){
  try{
    const rows=await (await fetch("/api/reports")).json();
    layer.clearLayers();$("list").textContent="";
    if(!rows.length){$("list").innerHTML='<div class="mu">Aktuell keine Meldungen.</div>'}
    for(const r of rows){
      L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:`<div class="em">${ICON[r.cat]||"🚓"}</div>`,iconSize:[32,32]})})
        .bindPopup(()=>card(r,true)).addTo(layer);
      $("list").append(card(r,false));
    }
  }catch{$("list").textContent="Laden fehlgeschlagen."}
}
$("send").onclick=async()=>{
  clearTimeout(tm);await resolve();
  if(!pos){$("msg").textContent="Bitte Position auf der Karte wählen.";return}
  const r=await fetch("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({lat:pos.lat,lng:pos.lng,loc:$("loc").value,cat:$("cat").value,note:$("note").value})});
  const j=await r.json().catch(()=>({}));
  $("msg").textContent=r.ok?"Gemeldet ✓":(j.error||"Fehler");
  if(r.ok){$("loc").value="";$("note").value="";load()}
};
load();setInterval(load,30000);
</script></body></html>
