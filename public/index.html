<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8"><title>Polizei-Melder</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#14181f;--mu:#667085;--ac:#1d4ed8;--bd:#e3e6ea}
@media(prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#181c23;--tx:#eef0f3;--mu:#9aa3b2;--ac:#6ea0ff;--bd:#2a303a}
.leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font:16px/1.4 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--ac);color:#fff}
header b{font-size:18px}.pill{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 11px;font-size:13px;margin-left:8px}
header button{background:none;border:0;color:#fff;font-size:20px;padding:4px 8px;cursor:pointer}
#mapw{position:relative;flex:1;min-height:120px}#map{position:absolute;inset:0}
.fab{position:absolute;right:12px;bottom:14px;z-index:1000;background:var(--ac);color:#fff;border:0;border-radius:99px;padding:13px 20px;font:600 16px system-ui;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.loc{position:absolute;left:12px;bottom:26px;z-index:1000;border-radius:99px;border:0;background:var(--card);color:var(--tx);font:600 15px system-ui;padding:12px 16px;box-shadow:0 2px 10px rgba(0,0,0,.3);cursor:pointer}
#sheet{background:var(--bg);border-radius:18px 18px 0 0;margin-top:-14px;z-index:1001;height:40dvh;display:flex;flex-direction:column;transition:height .25s;box-shadow:0 -4px 16px rgba(0,0,0,.15)}
#sheet.big{height:78dvh}#sheet.min{height:64px}
#handle{padding:10px 0 4px;text-align:center;cursor:pointer}#handle i{display:block;width:44px;height:5px;border-radius:9px;background:var(--bd);margin:0 auto}
#chips{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:6px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#list{overflow-y:auto;padding:4px 12px calc(14px + env(safe-area-inset-bottom));flex:1}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;font-weight:600;color:#fff;border-radius:99px;padding:3px 10px}
.mu{color:var(--mu);font-size:13px}.ttl{font-weight:600;margin:6px 0 2px}
.btn{font:inherit;font-size:14px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:7px 11px;margin:8px 6px 0 0;cursor:pointer}
.btn:disabled{opacity:.5}a.btn{display:inline-block;text-decoration:none}
#modal{position:fixed;left:0;right:0;bottom:0;z-index:2000;background:var(--card);border-radius:20px 20px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(0,0,0,.3);transform:translateY(110%);transition:transform .25s;max-height:70dvh;overflow-y:auto}
#modal.open{transform:none}
input,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
#cats{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.go{width:100%;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font:600 16px system-ui;margin-top:10px;cursor:pointer}
.x{float:right;background:none;border:0;color:var(--mu);font-size:22px;cursor:pointer}
.pin{width:34px;height:34px;border-radius:50%;background:#fff;border:3px solid;display:flex;align-items:center;justify-content:center;font-size:18px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:3000;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%}
#toast.on{opacity:.95}.warn{font-size:12px;color:var(--mu);margin:8px 2px}
</style></head><body>
<header><div><b>🚓 Polizei-Melder</b><span class="pill" id="count">0</span></div><div><button id="share" aria-label="Teilen">↗</button></div></header>
<div id="mapw"><div id="map"></div><button class="loc" id="loc2" aria-label="Mein Standort">📍 Mein Standort</button><button class="fab" id="fab">＋ Melden</button></div>
<section id="sheet"><div id="handle"><i></i></div><div id="chips"></div><div id="list"></div></section>
<div id="modal"><button class="x" id="close" aria-label="Schließen">×</button><b>Neue Meldung</b>
<input id="loc" maxlength="100" placeholder="Wo und was? z.B. Kuchl Markt Polizei" style="margin-top:10px">
<div class="mu" id="pos" style="margin-top:6px">Ort wird erkannt. Oder tippe oben auf die Karte.</div>
<div id="cats"></div>
<textarea id="note" rows="2" maxlength="200" placeholder="Details (optional)"></textarea>
<button class="go" id="send">Melden</button>
<div class="warn">In Österreich ist die Nutzung von Radarwarnern (auch Apps) während der Fahrt verboten. Nur als Beifahrer oder im Stand nutzen.</div></div>
<div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const $=id=>document.getElementById(id);
const C=[["Geschwindigkeitskontrolle (Radar/Laser)","Radar","📸","#dc2626"],["Verkehrskontrolle / Anhaltung","Kontrolle","🛑","#ea580c"],["Unfallaufnahme","Unfall","💥","#7c3aed"],["Straßensperre / Umleitung","Sperre","🚧","#d97706"],["Streife unterwegs","Streife","🚓","#1d4ed8"],["Sonstiges","Sonstiges","ℹ️","#64748b"]];
const M=Object.fromEntries(C.map(c=>[c[0],{s:c[1],e:c[2],c:c[3]}]));
const KW=[[C[0][0],["radar","blitzer","laser","messung","speed"]],[C[2][0],["unfall","crash"]],[C[3][0],["sperre","sperrung","gesperrt","umleitung"]],[C[1][0],["kontrolle","anhaltung","alkohol","checkpoint"]],[C[4][0],["polizei","streife","polizist","cops"]]];
const STOP=["bei","in","auf","der","die","das","am","an","von","gerade","jetzt","steht","stehen","wieder","ist","sind","mit"];
let rows=[],sig="",pos=null,userSet=false,me=null,filter=null,cat=C[4][0],lastQ="",tm=null,pin=null,meM=null,voted=new Set();
try{voted=new Set(JSON.parse(localStorage.getItem("v")||"[]"))}catch{}
const toast=t=>{const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),2800)};
const map=L.map("map",{zoomControl:false}).setView([47.8095,13.055],11);
L.control.zoom({position:"topright"}).addTo(map);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
const layer=L.layerGroup().addTo(map);
function chip(t,on,fn){const b=document.createElement("button");b.className="chip"+(on?" on":"");b.textContent=t;b.onclick=fn;return b}
function buildChips(){
  const f=$("chips");f.textContent="";
  f.append(chip("Alle",!filter,()=>{filter=null;buildChips();render(true)}));
  for(const c of C)f.append(chip(c[2]+" "+c[1],filter===c[0],()=>{filter=filter===c[0]?null:c[0];buildChips();render(true)}));
  const g=$("cats");g.textContent="";
  for(const c of C)g.append(chip(c[2]+" "+c[1],cat===c[0],()=>{cat=c[0];buildChips()}));
}
function setPos(ll){pos=ll;if(pin)pin.setLatLng(ll);else pin=L.marker(ll).addTo(map);$("pos").textContent="Position gesetzt ✓"}
map.on("click",e=>{userSet=true;lastQ=$("loc").value.trim();setPos(e.latlng)});
const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const ago=t=>{const m=Math.max(0,Math.round((Date.now()-t)/60000));return m<1?"gerade eben":m<60?`vor ${m} Min.`:`vor ${Math.floor(m/60)} Std. ${m%60} Min.`};
function geo(ok){
  if(!navigator.geolocation)return toast("Standort nicht verfügbar");
  navigator.geolocation.watchPosition(p=>{
    const ll=L.latLng(p.coords.latitude,p.coords.longitude),first=!me;me=ll;
    if(meM)meM.setLatLng(ll);else meM=L.circleMarker(ll,{radius:8,color:"#fff",weight:2,fillColor:"#1d4ed8",fillOpacity:1}).addTo(map);
    if(first&&!userSet){setPos(ll);map.setView(ll,13)}
    if(first)render(false);
  },()=>{},{enableHighAccuracy:true,maximumAge:15000});
}
async function vote(id,k){
  try{const r=await fetch(`/api/reports/${id}/${k}`,{method:"POST"});if(!r.ok)throw 0;
    voted.add(id+k);try{localStorage.setItem("v",JSON.stringify([...voted].slice(-200)))}catch{}
    toast(k==="still"?"Danke für die Bestätigung":"Danke, Meldung aktualisiert");load()}catch{toast("Aktion fehlgeschlagen")}
}
function card(r,popup){
  const m=M[r.cat]||M["Sonstiges"],d=document.createElement("div");if(!popup)d.className="card";
  const top=document.createElement("div");top.className="row";
  const tg=document.createElement("span");tg.className="tag";tg.style.background=m.c;tg.textContent=m.e+" "+m.s;
  const t=document.createElement("span");t.className="mu";t.textContent=ago(r.t);top.append(tg,t);
  const l=document.createElement("div");l.className="ttl";l.textContent=r.loc||"Ohne Ortsangabe";d.append(top,l);
  if(r.note){const n=document.createElement("div");n.textContent=r.note;d.append(n)}
  if(me){const x=document.createElement("div");x.className="mu";x.textContent=km(me,{lat:r.lat,lng:r.lng}).toFixed(1)+" km entfernt";d.append(x)}
  for(const [k,tx,n] of [["still","👍 Noch da",r.still],["gone","👋 Weg",r.gone]]){
    const b=document.createElement("button");b.className="btn";b.textContent=`${tx} (${n})`;b.disabled=voted.has(r.id+k);b.onclick=()=>vote(r.id,k);d.append(b)}
  const a=document.createElement("a");a.className="btn";a.target="_blank";a.rel="noopener";a.href=`https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}`;a.textContent="🧭 Route";d.append(a);
  return d;
}
function render(full){
  const vis=rows.filter(r=>!filter||r.cat===filter);$("count").textContent=vis.length;
  if(full){layer.clearLayers();for(const r of vis){const m=M[r.cat]||M["Sonstiges"],old=(Date.now()-r.t)>3600000;
    L.marker([r.lat,r.lng],{icon:L.divIcon({className:"",html:`<div class="pin" style="border-color:${m.c};opacity:${old?.65:1}">${m.e}</div>`,iconSize:[34,34],iconAnchor:[17,17]})}).bindPopup(()=>card(r,true)).addTo(layer)}}
  const L2=$("list");L2.textContent="";
  if(!vis.length){const e=document.createElement("div");e.className="mu";e.style.padding="10px 4px";e.textContent=filter?"Keine Meldungen in dieser Kategorie.":"Aktuell keine Meldungen. Alles ruhig.";L2.append(e);return}
  const s=[...vis];me?s.sort((a,b)=>km(me,a)-km(me,b)):s.sort((a,b)=>b.t-a.t);
  for(const r of s)L2.append(card(r,false));
}
async function load(){
  try{const a=await (await fetch("/api/reports")).json();if(!Array.isArray(a))throw 0;
    const n=JSON.stringify(a.map(r=>[r.id,r.still,r.gone]));rows=a;
    if(n!==sig){sig=n;render(true)}else render(false);
  }catch{$("list").textContent="Meldungen konnten nicht geladen werden."}
}
function parse(t){let c=null;const keep=[];
  for(const w of t.split(/[\s,]+/).filter(Boolean)){const l=w.toLowerCase();let hit=false;
    for(const [k,ks] of KW)if(ks.some(x=>l.includes(x))){c=c||k;hit=true;break}
    if(!hit&&!STOP.includes(l))keep.push(w)}
  return{c,place:keep.join(" ")}}
async function resolve(){
  const t=$("loc").value.trim();if(!t||t===lastQ)return;lastQ=t;
  const {c,place}=parse(t);if(c){cat=c;buildChips()}
  if(!place){$("pos").textContent="Kein Ort erkannt. Schreib z.B. Kuchl Markt oder tippe auf die Karte.";return}
  $("pos").textContent="Suche „"+place+"“…";
  try{const j=await (await fetch("/api/geocode?q="+encodeURIComponent(place))).json();
    if(typeof j.lat!=="number"){$("pos").textContent="Ort nicht gefunden. Tippe auf die Karte.";return}
    userSet=true;setPos(L.latLng(j.lat,j.lng));map.setView([j.lat,j.lng],14);$("pos").textContent="Erkannt: "+j.name+" ✓";
  }catch{$("pos").textContent="Suche fehlgeschlagen. Tippe auf die Karte."}
}
$("loc").addEventListener("input",()=>{clearTimeout(tm);tm=setTimeout(resolve,900)});
const open=v=>{$("modal").classList.toggle("open",v);setTimeout(()=>map.invalidateSize(),260)};
$("fab").onclick=()=>open(true);$("close").onclick=()=>open(false);
$("loc2").onclick=()=>{
  const go=ll=>{userSet=false;setPos(ll);map.setView(ll,15)};
  if(me)return go(me);
  if(!navigator.geolocation)return toast("Standort nicht verfügbar");
  toast("Standort wird ermittelt…");
  navigator.geolocation.getCurrentPosition(p=>{me=L.latLng(p.coords.latitude,p.coords.longitude);go(me)},()=>toast("Standortfreigabe fehlt. Bitte im Browser erlauben."),{enableHighAccuracy:true,timeout:10000});
};
$("handle").onclick=()=>{const s=$("sheet");const n=s.classList.contains("big")?"min":s.classList.contains("min")?"":"big";s.className=n;setTimeout(()=>map.invalidateSize(),280)};
$("share").onclick=()=>{const d={title:"Polizei-Melder",url:location.href};navigator.share?navigator.share(d).catch(()=>{}):navigator.clipboard&&navigator.clipboard.writeText(d.url).then(()=>toast("Link kopiert"))};
$("send").onclick=async()=>{
  clearTimeout(tm);await resolve();
  if(!pos)return toast("Bitte Ort eingeben oder auf die Karte tippen");
  $("send").disabled=true;
  try{const r=await fetch("/api/reports",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({lat:pos.lat,lng:pos.lng,loc:$("loc").value.trim(),cat,note:$("note").value.trim()})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){toast("Gemeldet ✓ Danke!");$("loc").value="";$("note").value="";lastQ="";userSet=false;open(false);map.setView(pos,15);load()}
    else toast(j.error||"Senden fehlgeschlagen");
  }catch{toast("Keine Verbindung")}
  $("send").disabled=false;
};
buildChips();geo();load();setInterval(load,30000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
